name: Issue watchdog
# Fails (GitHub mails the owner) if the Tuesday/Friday issue is not published by 10:00 Berlin.
on:
  schedule:
    - cron: '0 9 * * 2,5'   # Tue+Fri 09:00 UTC = 10:00 CET / 11:00 CEST
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: data.json is today's issue
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Berlin date +%F)"
          GOT="$(jq -r '.issueDate // empty' data.json)"
          echo "expected issueDate $TODAY, data.json has ${GOT:-none}"
          [ "$GOT" = "$TODAY" ] || { echo "::error::No AI Weekly issue for $TODAY"; exit 1; }
